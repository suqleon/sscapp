name: Build Android APK (EAS)

# Manual trigger: GitHub → Actions → "Build Android APK (EAS)" → Run workflow.
# Requires a repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
# The build runs on Expo's servers; the log ends with a link to download the .apk.

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Link project to the Expo account
        run: eas init --force --non-interactive

      - name: Build APK (preview profile)
        run: eas build --platform android --profile preview --non-interactive
